apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://homelab-openbao.openbao.svc:8200
      path: kv
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: alertmanager
          serviceAccountRef:
            name: alertmanager
