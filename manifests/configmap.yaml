apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_by: ['alertname', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: discord
        webhook_configs:
          - url: '{{ env "DISCORD_WEBHOOK_URL" }}'
            send_resolved: true
